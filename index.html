<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Idlan Zafran | Connect</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <style>
         /* Custom scrollbar for webkit to keep things clean */
         ::-webkit-scrollbar {
            width: 8px;
         }
         ::-webkit-scrollbar-track {
            background: transparent;
         }
         ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
         }
         ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
         }
         body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
         }
      </style>
   </head>
   <body class="bg-gradient-to-br from-[#0f172a] to-[#1e293b] min-h-screen flex items-center justify-center p-4 text-white relative">
      
      <div class="w-full max-w-[400px] bg-white/5 backdrop-blur-md border border-white/10 rounded-[24px] overflow-hidden shadow-2xl pb-8 mt-8 mb-8 relative z-10">
         
         <!-- Static Banner Image (Clickable) -->
         <div 
            class="relative w-full h-[250px] overflow-hidden bg-black/20 cursor-pointer group"
            onclick="openLightbox()"
            title="Click to view full image"
         >
            <img 
               src="images/banner.png" 
               alt="Profile Banner" 
               class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
               onerror="this.src='https://placehold.co/800x500/1e293b/ffffff?text=Main+Banner'"
            />
            <!-- Overlay icon on hover for affordance -->
            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
               <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-10 h-10 text-white drop-shadow-md">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607zM10.5 7.5v6m3-3h-6" />
               </svg>
            </div>
         </div>

         <div class="px-6 flex flex-col items-center -mt-12 relative z-20">
            <img
               src="profilephoto.jpg"
               onerror="this.src='https://placehold.co/110x110/ffffff/0f172a?text=IZ'"
               alt="Idlan Zafran"
               class="w-[110px] h-[110px] rounded-full object-cover border-4 border-white shadow-lg mb-3 bg-white"
            />

            <h1 class="text-2xl font-bold mb-1">Idlan Zafran</h1>
            <p class="text-sm text-white/70 font-medium mb-4">
               Researcher & Developer
            </p>

            <p class="text-center text-sm text-white/80 leading-relaxed mb-6 px-2">
               Student engineer by day, business at night, research on weekends and developer on occasion.
            </p>

            <div class="w-full flex flex-col space-y-3">
               <a
                  href="https://just-capri-e34.notion.site/idlanzafran"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="block w-full bg-white text-[#0f172a] text-center py-3.5 rounded-xl font-semibold transition-transform active:scale-95 hover:bg-gray-100 shadow-md"
               >
                  Web Portfolio
               </a>
               
               <a
                  href="https://github.com/IdlanZafran"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="block w-full bg-white text-[#0f172a] text-center py-3.5 rounded-xl font-semibold transition-transform active:scale-95 hover:bg-gray-100 shadow-md"
               >
                  GitHub
               </a>
               
               <a
                  href="https://idlanzafran.github.io/IdlanZafran-resume/"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="block w-full bg-white text-[#0f172a] text-center py-3.5 rounded-xl font-semibold transition-transform active:scale-95 hover:bg-gray-100 shadow-md"
               >
                  Resume 1
               </a>

               <a
                  href="https://idlanzafran.github.io/IdlanZafran-resume/"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="block w-full bg-white text-[#0f172a] text-center py-3.5 rounded-xl font-semibold transition-transform active:scale-95 hover:bg-gray-100 shadow-md"
               >
                  Resume 2
               </a>
               
               <a
                  href="https://www.researchgate.net/profile/Idlan-Zafran-Mohd-Zaidie"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="block w-full bg-white text-[#0f172a] text-center py-3.5 rounded-xl font-semibold transition-transform active:scale-95 hover:bg-gray-100 shadow-md"
               >
                  ResearchGate
               </a>
               
               <a
                  href="https://www.linkedin.com/in/idlanzafran/"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="block w-full bg-white text-[#0f172a] text-center py-3.5 rounded-xl font-semibold transition-transform active:scale-95 hover:bg-gray-100 shadow-md"
               >
                  LinkedIn
               </a>

               <a
                  href="https://www.arduinolibraries.info/authors/idlanzafran"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="block w-full bg-white text-[#0f172a] text-center py-3.5 rounded-xl font-semibold transition-transform active:scale-95 hover:bg-gray-100 shadow-md"
               >
                  Arduino
               </a>

               <div class="h-2"></div> <!-- Small visual separator -->

               <button
                  onclick="openContactModal()"
                  class="block w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white text-center py-3.5 rounded-xl font-bold transition-transform active:scale-95 hover:brightness-110 shadow-lg border border-white/20"
               >
                  Contact Me
               </button>
            </div>
         </div>
      </div>

      <!-- CRITICAL FIX: The default classes include pointer-events-none to prevent blocking clicks -->
      <div
         id="contact-modal"
         class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300"
      >
         <div
            class="bg-[#1e293b] w-full max-w-[400px] rounded-[24px] border border-white/10 p-6 shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto"
            id="contact-modal-content"
         >
            <div class="flex justify-between items-center mb-6">
               <h2 class="text-xl font-bold text-white">Get in Touch</h2>
               <button
                  onclick="closeContactModal()"
                  class="text-white/50 hover:text-white transition-colors"
               >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                     <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                  </svg>
               </button>
            </div>

            <form
               id="contact-form"
               action="https://formspree.io/f/mzezqqjy"
               method="POST"
               class="space-y-4"
            >
               <div>
                  <label class="block text-sm font-medium text-white/70 mb-1">Name</label>
                  <input type="text" name="name" required class="w-full bg-black/20 border border-white/10 rounded-lg px-4 py-2.5 text-white placeholder-white/30 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" placeholder="John Doe" />
               </div>
               <div>
                  <label class="block text-sm font-medium text-white/70 mb-1">Association / Company</label>
                  <input type="text" name="association" required class="w-full bg-black/20 border border-white/10 rounded-lg px-4 py-2.5 text-white placeholder-white/30 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" placeholder="University / Startup Inc." />
               </div>
               <div>
                  <label class="block text-sm font-medium text-white/70 mb-1">Phone Number</label>
                  <input type="tel" name="phone" required class="w-full bg-black/20 border border-white/10 rounded-lg px-4 py-2.5 text-white placeholder-white/30 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" placeholder="+60 12 345 6789" />
               </div>
               <div>
                  <label class="block text-sm font-medium text-white/70 mb-1">Details</label>
                  <textarea name="message" required rows="3" class="w-full bg-black/20 border border-white/10 rounded-lg px-4 py-2.5 text-white placeholder-white/30 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all resize-none" placeholder="Reason for reaching out..."></textarea>
               </div>

               <button type="submit" class="w-full mt-2 bg-white text-[#0f172a] font-bold py-3 rounded-xl hover:bg-gray-200 transition-colors active:scale-95 shadow-md">
                  Send Message
               </button>
            </form>
         </div>
      </div>

      <div
         id="lightbox-modal"
         class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300"
      >
         <button
            onclick="closeLightbox()"
            class="absolute top-6 right-6 text-white/70 hover:text-white transition-colors p-2 bg-black/50 rounded-full hover:bg-black/80 z-50"
         >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8">
               <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
         </button>
         
         <div class="relative w-full h-full flex justify-center items-center pointer-events-none">
            <!-- Ensure the image itself captures pointer events when open so you can interact with it if needed -->
            <img 
               id="lightbox-img"
               src="images/banner.png" 
               alt="Full Banner" 
               class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl transform scale-95 transition-transform duration-300 pointer-events-auto"
               onerror="this.src='https://placehold.co/800x500/1e293b/ffffff?text=Main+Banner'"
            />
         </div>
      </div>

      <script>
         const contactModal = document.getElementById("contact-modal");
         const contactModalContent = document.getElementById("contact-modal-content");
         
         const lightboxModal = document.getElementById("lightbox-modal");
         const lightboxImg = document.getElementById("lightbox-img");

         // Remove pointer-events-none when opening, add back when closing
         function openContactModal() {
            contactModal.classList.remove("opacity-0", "pointer-events-none");
            contactModalContent.classList.remove("scale-95");
            contactModalContent.classList.add("scale-100");
         }

         function closeContactModal() {
            contactModal.classList.add("opacity-0", "pointer-events-none");
            contactModalContent.classList.remove("scale-100");
            contactModalContent.classList.add("scale-95");
         }

         function openLightbox() {
            lightboxModal.classList.remove("opacity-0", "pointer-events-none");
            lightboxImg.classList.remove("scale-95");
            lightboxImg.classList.add("scale-100");
         }

         function closeLightbox() {
            lightboxModal.classList.add("opacity-0", "pointer-events-none");
            lightboxImg.classList.remove("scale-100");
            lightboxImg.classList.add("scale-95");
         }

         // Close modals when clicking the dark backdrop
         contactModal.addEventListener("click", (e) => {
            if (e.target === contactModal) {
               closeContactModal();
            }
         });

         lightboxModal.addEventListener("click", (e) => {
            if (e.target === lightboxModal) {
               closeLightbox();
            }
         });
      </script>
   </body>
</html>
