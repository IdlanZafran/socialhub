<style>

/* =========================
   GLOBAL
   ========================= */

* {
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, Helvetica, Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #0f172a 0%,
        #1e293b 100%
    );

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;

    margin: 0;
    padding: 30px 15px;

    color: white;
}


/* =========================
   MAIN CARD
   ========================= */

.container {
    width: 100%;
    max-width: 420px;

    text-align: center;

    position: relative;
    isolation: isolate;

    /*
        Dark translucent layer over the
        blurred banner background.
    */
    background: rgba(15, 23, 42, 0.65);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border: 1px solid rgba(255, 255, 255, 0.10);

    border-radius: 24px;

    padding: 0 24px 32px;

    overflow: hidden;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.30);
}


/* =========================
   BLURRED BANNER BACKGROUND
   ========================= */

.container::before {
    content: "";

    position: absolute;
    inset: 0;

    background-image: url("images/banner.png");

    background-size: cover;
    background-position: center;

    filter: blur(25px);

    opacity: 0.18;

    /*
        Slightly enlarge the image so
        the blurred edges don't show.
    */
    transform: scale(1.1);

    z-index: -2;
}


/* =========================
   DARK OVERLAY
   ========================= */

.container::after {
    content: "";

    position: absolute;
    inset: 0;

    background: rgba(15, 23, 42, 0.55);

    z-index: -1;
}


/* Keep all content above
   the background layers */

.container > * {
    position: relative;
    z-index: 1;
}


/* =========================
   BANNER
   ========================= */

.banner {
    width: calc(100% + 48px);

    height: 190px;

    margin-left: -24px;

    overflow: hidden;
}

.banner-img {
    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;

    display: block;
}


/* =========================
   PROFILE
   ========================= */

.profile-section {
    position: relative;

    /*
        Pull profile picture slightly
        over the banner.
    */
    margin-top: -55px;
}

.profile-img {
    width: 110px;
    height: 110px;

    border-radius: 50%;

    object-fit: cover;

    display: block;

    margin: 0 auto 14px;

    /*
        Border separates profile
        picture from banner.
    */
    border: 4px solid #172033;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.30);
}


/* =========================
   NAME
   ========================= */

h1 {
    font-size: 1.55rem;

    line-height: 1.2;

    margin: 0 0 8px;

    letter-spacing: -0.02em;
}


/* =========================
   BIO
   ========================= */

.bio {
    max-width: 330px;

    margin: 0 auto 18px;

    color: rgba(255, 255, 255, 0.68);

    font-size: 0.90rem;

    line-height: 1.55;
}


/* =========================
   CONTACT
   ========================= */

.contact {
    margin: 0 0 24px;

    font-size: 0.85rem;

    color: rgba(255, 255, 255, 0.55);
}

.contact a {
    color: rgba(255, 255, 255, 0.90);

    text-decoration: none;
}

.contact a:hover {
    text-decoration: underline;
}


/* =========================
   LINKS
   ========================= */

.links {
    display: flex;

    flex-direction: column;

    gap: 11px;
}


.link-card {
    display: flex;

    align-items: center;
    justify-content: center;

    min-height: 52px;

    background: rgba(255, 255, 255, 0.96);

    color: #0f172a;

    text-decoration: none;

    padding: 14px 18px;

    border-radius: 13px;

    font-size: 0.92rem;

    font-weight: 600;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}


/* Desktop hover */

.link-card:hover {
    transform: translateY(-2px);

    background: white;

    box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.18);
}


/* Mobile / click */

.link-card:active {
    transform: scale(0.97);
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 480px) {

    body {
        align-items: flex-start;

        padding: 20px 12px;
    }

    .container {
        padding-left: 20px;
        padding-right: 20px;
        padding-bottom: 28px;
    }

    .banner {
        width: calc(100% + 40px);

        margin-left: -20px;

        height: 175px;
    }

    .profile-section {
        margin-top: -50px;
    }

    .profile-img {
        width: 100px;
        height: 100px;
    }

    h1 {
        font-size: 1.4rem;
    }

    .bio {
        font-size: 0.86rem;

        margin-bottom: 16px;
    }

    .contact {
        margin-bottom: 22px;
    }

    .link-card {
        min-height: 50px;
    }
}

</style>
