<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idlan Zafran | Connect</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
        }
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 24px;
            border: 1px rgba(255, 255, 255, 0.1) solid;
        }
        
        /* ADDED: Styling to make your profile image round and the right size */
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2); /* Adds a subtle border */
        }

        h1 { font-size: 1.5rem; margin-bottom: 5px; }
        p { opacity: 0.7; font-size: 0.9rem; margin-bottom: 30px; }
        .link-card {
            display: block;
            background: white;
            color: #0f172a;
            text-decoration: none;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .link-card:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="container">
        <!-- FIXED: Added quotes and an alt attribute -->
        <img src="profilephoto.jpg" alt="Idlan Zafran" class="profile-img">
        
        <h1>Idlan Zafran</h1>
        <p>Researcher & Developer</p>
        
        <a href="https://just-capri-e34.notion.site/idlanzafran" class="link-card">Web Portfolio</a>
        <a href="https://github.com/IdlanZafran" class="link-card">GitHub</a>
        <a href="https://idlanzafran-resume.github.io/" class="link-card">Resume</a>     
        <a href="https://www.researchgate.net/profile/Idlan-Zafran-Mohd-Zaidie" class="link-card">ResearchGate</a>
        <a href="https://www.linkedin.com/in/idlanzafran/" class="link-card">LinkedIn</a>        
    </div>
</body>
</html>
