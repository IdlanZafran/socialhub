        ========================================================= */

        .card {

            margin-top: 32px;

            padding-bottom: 32px;

        .banner-button {
            position: relative;

            display: block;

            width: 100%;

            background: rgba(0, 0, 0, 0.2);

            outline-offset: -3px;

        .banner-image {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: scale(1);

            transition:
                transform 500ms ease;
        }

            transform: scale(1.05);

        /*

        .banner-overlay {

            align-items: center;

            pointer-events: none;

         * images/banner-fallback.jpg
         * images/profile-fallback.jpg
         */

        bannerImage.addEventListener("error", function () {

            if (this.dataset.fallbackApplied === "true") {
                return;
            }

            this.dataset.fallbackApplied = "true";

            this.src =
                "https://placehold.co/800x500/1e293b/ffffff?text=Main+Banner";
        });


        profilePhoto.addEventListener("error", function () {

            if (this.dataset.fallbackApplied === "true") {
                return;
            }

            this.dataset.fallbackApplied = "true";

            this.src =
                "https://placehold.co/110x110/ffffff/0f172a?text=IZ";
        });


        lightboxImage.addEventListener("error", function () {

            if (this.dataset.fallbackApplied === "true") {
                return;
            }

            this.dataset.fallbackApplied = "true";

            this.src =
                "https://placehold.co/800x500/1e293b/ffffff?text=Main+Banner";
        });


        /* =====================================================
           BODY SCROLL LOCK
        ====================================================== */

        function lockBodyScroll() {
            document.body.classList.add("modal-open");
        }

        function unlockBodyScroll() {

            /*
             * Only unlock scrolling if neither modal is visible.
             */
            const contactOpen =
                contactModal.classList.contains("modal-visible");

            const lightboxOpen =
                lightboxModal.classList.contains("modal-visible");

            if (!contactOpen && !lightboxOpen) {
                document.body.classList.remove("modal-open");
            }
        }


        /* =====================================================
           CONTACT MODAL
        ====================================================== */

        function openContactModal() {

            /*
             * Close the other modal first.
             */
            closeLightbox();

            contactModal.classList.add("modal-visible");

            contactModal.setAttribute(
                "aria-hidden",
                "false"
            );

            lockBodyScroll();

            /*
             * Focus the first input after the animation starts.
             */
            window.setTimeout(function () {

                const firstInput =
                    contactModal.querySelector("input");

                if (firstInput) {
                    firstInput.focus();
                }

            }, 50);
        }


        function closeContactModal() {

            contactModal.classList.remove("modal-visible");

            contactModal.setAttribute(
                "aria-hidden",
                "true"
            );

            unlockBodyScroll();
        }


        /* =====================================================
           LIGHTBOX
        ====================================================== */

        function openLightbox() {

            /*
             * Close contact modal first.
             */
            closeContactModal();

            /*
             * Make sure the lightbox image uses the same
             * source as the main banner.
             */
            lightboxImage.src = bannerImage.currentSrc ||
                                bannerImage.src;

            lightboxModal.classList.add("modal-visible");

            lightboxModal.setAttribute(
                "aria-hidden",
                "false"
            );

            lockBodyScroll();

            window.setTimeout(function () {
                lightboxCloseButton.focus();
            }, 50);
        }


        function closeLightbox() {

            lightboxModal.classList.remove(
                "modal-visible"
            );

            lightboxModal.setAttribute(
                "aria-hidden",
                "true"
            );

            unlockBodyScroll();
        }


        /* =====================================================
           EVENT LISTENERS
        ====================================================== */

        bannerButton.addEventListener(
            "click",
            openLightbox
        );


        contactButton.addEventListener(
            "click",
            openContactModal
        );


        contactCloseButton.addEventListener(
            "click",
            closeContactModal
        );


        lightboxCloseButton.addEventListener(
            "click",
            closeLightbox
        );


        /* =====================================================
           CLICK OUTSIDE MODALS
        ====================================================== */

        contactModal.addEventListener(
            "click",
            function (event) {

                /*
                 * Only close when the actual backdrop is clicked.
                 *
                 * Clicking inside the form will NOT close it.
                 */
                if (event.target === contactModal) {
                    closeContactModal();
                }
            }
        );


        lightboxModal.addEventListener(
            "click",
            function (event) {

                /*
                 * Only close when the actual backdrop is clicked.
                 */
                if (event.target === lightboxModal) {
                    closeLightbox();
                }
            }
        );


        /*
         * Clicking the lightbox container outside the image
         * also closes it.
         */
        lightboxContainer.addEventListener(
            "click",
            function (event) {

                if (event.target === lightboxContainer) {
                    closeLightbox();
                }
            }
        );


        /* =====================================================
           ESCAPE KEY
        ====================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key !== "Escape") {
                    return;
                }

                if (
                    contactModal.classList.contains(
                        "modal-visible"
                    )
                ) {
                    closeContactModal();
                    return;
                }

                if (
                    lightboxModal.classList.contains(
                        "modal-visible"
                    )
                ) {
                    closeLightbox();
                }
            }
        );


        /* =====================================================
           DEBUGGING SAFETY CHECK
        ====================================================== */

        /*
         * This is intentionally lightweight.
         *
         * If something ever accidentally causes a closed modal
         * to become interactive, force it back into the safe
         * state.
         */

        function enforceModalSafety() {

            if (
                !contactModal.classList.contains(
                    "modal-visible"
                )
            ) {
                contactModal.setAttribute(
                    "aria-hidden",
                    "true"
                );
            }

            if (
                !lightboxModal.classList.contains(
                    "modal-visible"
                )
            ) {
                lightboxModal.setAttribute(
                    "aria-hidden",
                    "true"
                );
            }
        }

        enforceModalSafety();


        /* =====================================================
           OPTIONAL DEVELOPMENT DIAGNOSTIC
        ====================================================== */

        /*

        /* =====================================================

        /*

        contactModal.classList.remove(
            "modal-visible"
        );

        lightboxModal.classList.remove(

        );

        contactModal.setAttribute(

        lightboxModal.setAttribute(

        document.body.classList.remove(
