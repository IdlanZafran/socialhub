        /* =========================================================
           RESET
        ========================================================== */

        *,
        *::before,
        *::after {

        html,
        body {
            margin: 0;
            padding: 0;

        img {
            display: block;
        }

        a,
        button {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font: inherit;
        }


        /* =========================================================
           PAGE
        ========================================================== */

        .page {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(16px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(16px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));
        }


        /* =========================================================
           CARD
        ========================================================== */

        .card {
            position: relative;

            width: 100%;
            max-width: 400px;

            margin: 32px 0;

            overflow: hidden;

            background: rgba(255, 255, 255, 0.05);

            border:
                1px solid rgba(255, 255, 255, 0.10);

            border-radius: 24px;

            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }


        /* =========================================================
           BANNER AREA
        ========================================================== */

        /*
         * The banner is deliberately NOT a button.
         *
         * The image itself cannot receive pointer events.
         * The transparent button above it handles the click.
         */

        .banner {
            position: relative;

            width: 100%;
            height: 250px;

            overflow: hidden;

            background: #1e293b;
        }

        .banner-image {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            /*
             * CRITICAL:
             *
             * The image can NEVER receive a click.
             */
            pointer-events: none;

            user-select: none;
            -webkit-user-drag: none;

            transform: scale(1);

            transition:
                transform 500ms ease;
        }

        .banner:hover .banner-image {
            transform: scale(1.05);
        }


        /* =========================================================
           BANNER CLICK LAYER
        ========================================================== */

        .banner-click {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            padding: 0;
            margin: 0;

            border: 0;

            background: transparent;

            cursor: pointer;

            z-index: 2;

            appearance: none;
            -webkit-appearance: none;
        }

        .banner-click:focus-visible {
            outline:
                3px solid rgba(96, 165, 250, 0.95);

            outline-offset: -3px;
        }


        /* =========================================================
           BANNER OVERLAY
        ========================================================== */

        .banner-overlay {
            position: absolute;

            inset: 0;

            z-index: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                rgba(0, 0, 0, 0.40);

            opacity: 0;

            /*
             * CRITICAL:
             * The overlay itself cannot receive clicks.
             */
            pointer-events: none;

            transition:
                opacity 300ms ease;
        }

        .banner:hover .banner-overlay,
        .banner:focus-within .banner-overlay {
            opacity: 1;
        }

        .banner-icon {
            width: 40px;
            height: 40px;

            color: white;

            filter:
                drop-shadow(
                    0 2px 4px rgba(0, 0, 0, 0.5)

        }

    <script>
        "use strict";


        /* =====================================================
           ELEMENTS
        ====================================================== */

        const banner =
            document.getElementById("banner");

        const bannerImage =
            document.getElementById("banner-image");

        const bannerClick =
            document.getElementById("banner-click");

        const contactButton =
            document.getElementById("contact-button");

        const contactModal =
            document.getElementById("contact-modal");

        const contactModalBox =
            document.getElementById("contact-modal-box");

        const contactClose =
            document.getElementById("contact-close");

        const lightboxModal =
            document.getElementById("lightbox-modal");

        const lightboxImage =
            document.getElementById("lightbox-image");

        const lightboxClose =
            document.getElementById("lightbox-close");

        const lightboxWrapper =
            document.getElementById("lightbox-wrapper");


        /* =====================================================
           IMAGE SAFETY
        ====================================================== */

        /*
         * These handlers do NOT create external fallback images.
         *
         * This prevents an image failure from creating another
         * network dependency.
         */

        bannerImage.addEventListener(
            "error",
            function () {

                this.style.display = "none";

                banner.style.background =
                    "#1e293b";
            }
        );


        /* =====================================================
           MODAL HELPERS
        ====================================================== */

        function lockScroll() {
            document.body.style.overflow = "hidden";
        }


        function unlockScroll() {

            const contactOpen =
                contactModal.classList.contains("open");

            const lightboxOpen =
                lightboxModal.classList.contains("open");

            if (!contactOpen && !lightboxOpen) {
                document.body.style.overflow = "";
            }
        }


        /* =====================================================
           CONTACT MODAL
        ====================================================== */

        function openContactModal() {

            closeLightbox();

            contactModal.classList.add("open");

            contactModal.setAttribute(
                "aria-hidden",
                "false"
            );

            lockScroll();

            window.setTimeout(
                function () {

                    const input =
                        document.getElementById("name");

                    if (input) {
                        input.focus();
                    }

                },
                50
            );
        }


        function closeContactModal() {

            contactModal.classList.remove("open");

            contactModal.setAttribute(
                "aria-hidden",
                "true"
            );

            unlockScroll();
        }


        /* =====================================================
           LIGHTBOX
        ====================================================== */

        function openLightbox() {

            closeContactModal();

            /*
             * Set the image source ONLY when opening.
             *
             * While the lightbox is closed, its image has src=""
             * and the entire modal is display:none.
             */
            lightboxImage.src =
                bannerImage.currentSrc ||
                bannerImage.src;

            lightboxModal.classList.add("open");

            lightboxModal.setAttribute(
                "aria-hidden",
                "false"
            );

            lockScroll();

            window.setTimeout(
                function () {
                    lightboxClose.focus();
                },
                50
            );
        }


        function closeLightbox() {

            lightboxModal.classList.remove("open");

            lightboxModal.setAttribute(
                "aria-hidden",
                "true"
            );

            /*
             * Remove the image source after closing.
             *
             * This ensures there is no image element with an
             * active source sitting around when the lightbox
             * is closed.
             */
            lightboxImage.removeAttribute("src");

            unlockScroll();
        }


        /* =====================================================
           EVENTS
        ====================================================== */

        bannerClick.addEventListener(
            "click",
            function (event) {

                event.preventDefault();
                event.stopPropagation();

                openLightbox();
            }
        );


        contactButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                openContactModal();
            }
        );


        contactClose.addEventListener(
            "click",
            function () {
                closeContactModal();
            }
        );


        lightboxClose.addEventListener(
            "click",
            function () {
                closeLightbox();
            }
        );


        /* =====================================================
           CLICK OUTSIDE
        ====================================================== */

        contactModal.addEventListener(
            "click",
            function (event) {

                if (
                    event.target === contactModal
                ) {
                    closeContactModal();
                }
            }
        );


        lightboxModal.addEventListener(
            "click",
            function (event) {

                if (
                    event.target === lightboxModal
                ) {
                    closeLightbox();
                }
            }
        );


        /* =====================================================
           ESCAPE
        ====================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key !== "Escape") {
                    return;
                }

                if (
                    contactModal.classList.contains("open")
                ) {
                    closeContactModal();
                    return;
                }

                if (
                    lightboxModal.classList.contains("open")
                ) {
                    closeLightbox();
                }
            }
        );


        /* =====================================================
           PREVENT IMAGE DRAGGING
        ====================================================== */

        bannerImage.addEventListener(
            "dragstart",
            function (event) {
                event.preventDefault();
            }
        );


        lightboxImage.addEventListener(
            "dragstart",
            function (event) {
                event.preventDefault();
            }
        );


        /* =====================================================
           INITIAL STATE
        ====================================================== */

        /*
         * Explicitly guarantee the lightbox starts closed.
         */

        contactModal.classList.remove("open");
        lightboxModal.classList.remove("open");

        contactModal.setAttribute(
            "aria-hidden",
            "true"
        );

        lightboxModal.setAttribute(
            "aria-hidden",
            "true"
        );

        lightboxImage.removeAttribute("src");

        document.body.style.overflow = "";


        /* =====================================================
           DEBUGGING TOOL
        ====================================================== */

        /*
         * This does NOT affect the website.
         *
         * If the problem somehow still occurs, open the browser
         * console and run:
         *
         *     window.findBlockingElement()
         *
         * It will tell you exactly which element is underneath
         * the center of the screen.
         */

        window.findBlockingElement = function () {

            const x =
                window.innerWidth / 2;

            const y =
                window.innerHeight / 2;

            const element =
                document.elementFromPoint(x, y);

            console.log(
                "Element at screen center:",
                element
            );

            if (element) {

                console.log(
                    "TAG:",
                    element.tagName
                );

                console.log(
                    "ID:",
                    element.id
                );

                console.log(
                    "CLASS:",
                    element.className
                );

                console.log(
                    "RECT:",
                    element.getBoundingClientRect()
                );

                console.log(
                    "POINTER EVENTS:",
                    getComputedStyle(
                        element
                    ).pointerEvents
                );

                console.log(
                    "POSITION:",
                    getComputedStyle(
                        element
                    ).position
                );

                console.log(
                    "DISPLAY:",
                    getComputedStyle(
                        element
                    ).display
                );

                console.log(
                    "VISIBILITY:",
                    getComputedStyle(
                        element
                    ).visibility
                );
            }

            return element;
        };
    </script>
