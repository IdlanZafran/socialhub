<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Idlan Zafran | Connect</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            background: #0f172a;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #0f172a;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            margin: 0;
            padding: 30px 15px;

            color: white;
        }


        /* =========================
           MAIN CARD
           ========================= */

        .container {
            width: 100%;
            max-width: 420px;

            position: relative;

            overflow: hidden;

            border-radius: 24px;

            background: rgba(15, 23, 42, 0.55);

            border: 1px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .profile-section {
            position: relative; 
            margin-top: -55px; 
            text-align: center; 
        }


        /* =========================
           BLURRED BANNER BACKGROUND
           ========================= */

        .background-image {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            /*
             * Same banner.png,
             * stretched across the entire card.
             */

            object-position: center;

            /*
             * Blur the banner.
             */

            filter: blur(30px);

            /*
             * How visible the blurred image is.
             */

            opacity: 0.45;

            /*
             * Prevents blurred edges
             * from becoming transparent.
             */

            transform: scale(1.15);

            z-index: 0;

            pointer-events: none;
        }


        /* =========================
           DARKEN BLURRED BACKGROUND
           ========================= */

        .background-overlay {
            position: absolute;

            inset: 0;

            background: rgba(15, 23, 42, 0.35);

            z-index: 1;

            pointer-events: none;
        }


        /* =========================
           CONTENT
           ========================= */

        .content {
            position: relative;

            z-index: 2;

            padding: 0 24px 32px;
        }


        /* =========================
           SHARP TOP BANNER
           ========================= */

        .banner {
            width: calc(100% + 48px);

            height: 190px;

            margin-left: -24px;

            overflow: hidden;
        }

        .banner-img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center;
        }


        /* =========================
           PROFILE
           ========================= */

        .profile-section {
            position: relative;

            margin-top: -55px;
        }

        .profile-img {
            display: block;

            width: 110px;
            height: 110px;

            margin: 0 auto 14px;

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid #172033;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.30);
        }


        /* =========================
           NAME
           ========================= */

        h1 {
            font-size: 1.55rem;

            line-height: 1.2;

            margin: 0 0 8px;

            letter-spacing: -0.02em;
        }


        /* =========================
           BIO
           ========================= */

        .bio {
            max-width: 330px;

            margin: 0 auto 18px;

            color: rgba(255, 255, 255, 0.78);

            font-size: 0.90rem;

            line-height: 1.55;
        }


        /* =========================
           CONTACT
           ========================= */

        .contact {
            margin: 0 0 24px;

            font-size: 0.85rem;

            color: rgba(255, 255, 255, 0.65);
        }

        .contact a {
            color: rgba(255, 255, 255, 0.95);

            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }


        /* =========================
           LINKS
           ========================= */

        .links {
            display: flex;

            flex-direction: column;

            gap: 11px;
        }

        .link-card {
            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 52px;

            padding: 14px 18px;

            border-radius: 13px;

            background: rgba(255, 255, 255, 0.96);

            color: #0f172a;

            text-decoration: none;

            font-size: 0.92rem;

            font-weight: 600;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .link-card:hover {
            transform: translateY(-2px);

            background: white;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.18);
        }

        .link-card:active {
            transform: scale(0.97);
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 480px) {

            body {
                align-items: flex-start;

                padding: 20px 12px;
            }

            .content {
                padding-left: 20px;
                padding-right: 20px;
                padding-bottom: 28px;
            }

            .banner {
                width: calc(100% + 40px);

                margin-left: -20px;

                height: 175px;
            }

            .profile-section {
                margin-top: -50px;
            }

            .profile-img {
                width: 100px;
                height: 100px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .bio {
                font-size: 0.86rem;

                margin-bottom: 16px;
            }

            .contact {
                margin-bottom: 22px;
            }

            .link-card {
                min-height: 50px;
            }
        }

    </style>
</head>


<body>

    <div class="container">

            <div class="links">

                </a>

                <a

                >

                </a>

                <a

                <a
                    href="https://www.linkedin.com/in/idlanzafran/"

                </a>

        </div>

    </div>

</body>
</html>
